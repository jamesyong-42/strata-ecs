# The merge gate, verbatim: `pnpm run ci` = typecheck + lint + unit suites + stress smoke —
# the same command run locally before every commit. One job on purpose; the suite is fast
# (a few minutes) and a single green check is easier to reason about than a matrix.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's `packageManager` field (single source of truth).
      - uses: pnpm/action-setup@v4

      # Node version comes from .nvmrc (single source of truth); pnpm store cached between runs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      # The publish artifact must stay buildable — dts generation can break independently of tests.
      - run: pnpm build
