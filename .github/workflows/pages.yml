# The docs site + the live demo, deployed to GitHub Pages on every push to main.
# The three doc pages are committed HTML (docs/*.html — copied verbatim); the demo is the
# canvas-editor example BUILT FRESH here against the same commit's src/, so it never goes
# stale and no build artifacts (3MB of wasm included) ever land in git.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The demo lives under /strata-ecs/demo/ — vite needs the base for asset URLs.
      - run: DEMO_BASE=/strata-ecs/demo/ pnpm --filter @strata-ecs/example-canvas-editor build

      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp docs/*.html _site/
          cp -r examples/canvas-editor/dist/. _site/demo/
          # The stall-probe and swarm-probe are dev measurement harnesses, not part of the public demo.
          rm -f _site/demo/probe.html _site/demo/swarm.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
