# The strata library is the workspace root; the comparative benchmark is an isolated member so its
# rival-ECS dependencies (bitecs, becsy, miniplex, koota, mitata) never enter strata's own package.
# The canvas-editor example is isolated the same way (vite/typescript stay out of strata's graph).
#
# ONE LORO COPY, ALWAYS. loro-crdt is wasm with instance-identity checks: a LoroDoc built by one copy
# and handed to code resolving another dies with `expected instance of LoroDoc`. This is now enforced
# STRUCTURALLY rather than by convention — the root's `pnpm.overrides` maps loro-crdt to `$loro-crdt`,
# so every member and transitive dependant resolves the ROOT's version whatever they declare, and
# `pnpm check:deps` (first step of `pnpm run ci`) asserts exactly one copy is resolvable.
# Bump it with `pnpm update -r loro-crdt`, which moves every member together.
# Why the belt AND braces: the skew is invisible where people look — `pnpm run ci` and
# `pnpm test:stress` stay FULLY GREEN with two copies in the tree, because nothing there hands a doc
# across a package seam. Only the headless-host smoke does, and it fails as four unrelated-looking
# end-to-end errors. That cost two misdiagnoses before the override existed.
packages:
  - "bench/compare"
  # The sync-path benchmark — what a peer pays to APPLY a remote edit as the document grows.
  # Deliberately declares no loro-crdt of its own — it resolves loro THROUGH strata so there is
  # provably one wasm instance; the version under test is the root pin (see bench/sync/README.md).
  - "bench/sync"
  - "examples/canvas-editor"
  # The WebSocket relay for the canvas-editor collab demo — a dumb byte-relay (its only dep is `ws`),
  # isolated the same way so the server's dep never enters strata's own graph.
  - "examples/collab-server"
  # The Electron desktop shell around the canvas-editor (serverless tailnet collab via truffle) —
  # electron/truffle stay out of strata's graph the same way.
  - "examples/canvas-desktop"
  # The headless/Node document host — authoritative Worlds server-side, syncing over ws + persisting to
  # disk; isolated the same way so its ws/loro-crdt deps stay out of strata's own graph.
  - "examples/headless-host"
